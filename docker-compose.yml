services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      # /opt/venv lives inside image, NOT under /workspace,
      # so bind-mount no longer hides installed deps.
      # Exclude host noise from container:
      - /workspace/__pycache__
      - /workspace/.venv
      - /workspace/tests/__pycache__
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://fleetgo:fleetgo_password@postgres:5432/fleetgo
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-in-development}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-this-in-development}
      UV_PROJECT_ENVIRONMENT: /opt/venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["uv", "run", "fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
    stdin_open: true
    tty: true

  postgres:
    image: postgres:17
    container_name: fleetgo-postgres
    environment:
      POSTGRES_USER: fleetgo
      POSTGRES_PASSWORD: fleetgo_password
      POSTGRES_DB: fleetgo
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetgo -d fleetgo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: fleetgo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: