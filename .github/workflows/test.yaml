name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fleetgo
          POSTGRES_PASSWORD: fleetgo_password
          POSTGRES_DB: fleetgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetgo -d fleetgo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+psycopg://fleetgo:fleetgo_password@localhost:5432/fleetgo
      TEST_DATABASE_URL: postgresql+psycopg://fleetgo:fleetgo_password@localhost:5432/fleetgo_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-not-a-real-secret
      WEBHOOK_SECRET: ci-only-not-a-real-secret
      FIRESTORE_ENABLED: "false"
      ENVIRONMENT: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uvx ruff check .

      - name: Test
        run: uv run pytest -v